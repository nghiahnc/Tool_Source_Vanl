<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Văn Hóa Việt · Ôn tập trắc nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — Lacquerware & Đông Sơn drum inspired palette
   ============================================================ */
:root{
  --lacquer-black:#171310;
  --lacquer-surface:#211b16;
  --lacquer-surface-2:#2a2219;
  --lacquer-border:#3c3123;
  --gold:#cba135;
  --gold-soft:#e4c766;
  --lacquer-red:#a6283c;
  --lacquer-red-soft:#c94a5c;
  --jade:#3b7a57;
  --jade-soft:#5a9c76;
  --paper:#f3ead4;
  --paper-card:#fffdf8;
  --ink:#2a2118;
  --ink-soft:#6b5f4c;

  --bg:var(--lacquer-black);
  --surface:var(--lacquer-surface);
  --surface-2:var(--lacquer-surface-2);
  --border:var(--lacquer-border);
  --text:#efe6d4;
  --text-soft:#b8ab90;
  --accent:var(--gold);
  --accent-soft:var(--gold-soft);
  --danger:var(--lacquer-red);
  --success:var(--jade);
  --success-soft:var(--jade-soft);

  --radius:14px;
  --radius-sm:8px;
  --shadow:0 10px 30px -10px rgba(0,0,0,.5);
  --font-display:'Fraunces', serif;
  --font-body:'Be Vietnam Pro', sans-serif;
}
html[data-theme="light"]{
  --bg:var(--paper);
  --surface:var(--paper-card);
  --surface-2:#fbf6ea;
  --border:#e3d5ae;
  --text:var(--ink);
  --text-soft:var(--ink-soft);
  --accent:#9c7a1f;
  --accent-soft:#7d6119;
  --shadow:0 10px 30px -12px rgba(60,45,10,.25);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  transition:background .4s ease, color .4s ease;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(203,161,53,.05), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(166,40,60,.06), transparent 45%);
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,.font-display{font-family:var(--font-display);}
button{font-family:inherit;}
::selection{background:var(--gold);color:var(--lacquer-black);}

/* Focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============ Signature motif: Đông Sơn drum rings ============ */
.drum-mark{
  width:38px;height:38px;flex:none;
}
.drum-mark svg{width:100%;height:100%;display:block;}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  position:relative;z-index:1;
  max-width:900px;
  margin:0 auto;
  padding:20px 18px 90px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:6px 2px 22px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1{
  font-size:22px;
  margin:0;
  letter-spacing:.2px;
  font-weight:600;
}
.brand .sub{
  display:block;
  font-family:var(--font-body);
  font-size:11.5px;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
  margin-top:2px;
}
.top-actions{display:flex;align-items:center;gap:8px;}

.icon-btn{
  width:40px;height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .2s ease, border-color .2s ease, background .3s ease;
}
.icon-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.icon-btn svg{width:19px;height:19px;}

/* Tabs */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:22px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:none;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-soft);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:all .25s ease;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--text); border-color:var(--accent);}
.tab-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--lacquer-black);
  font-weight:600;
}
html[data-theme="light"] .tab-btn.active{color:#fffdf8;}

.view{display:none; animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ============================================================
   CONTROLS: search / filter / progress
   ============================================================ */
.control-row{
  display:flex;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.search-box{
  flex:1 1 220px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:11px 14px 11px 40px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:14.5px;
  font-family:var(--font-body);
}
.search-box input::placeholder{color:var(--text-soft);}
.search-box svg{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:16px;height:16px; color:var(--text-soft); pointer-events:none;
}
.filter-select{
  padding:11px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:14px;
  font-family:var(--font-body);
  cursor:pointer;
}

.progress-wrap{
  display:flex;align-items:center;gap:14px;
  margin-bottom:18px;
  padding:14px 16px;
  border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
}
.progress-ring{flex:none; width:44px;height:44px;}
.progress-info{flex:1;}
.progress-info .label{font-size:12.5px; color:var(--text-soft); margin-bottom:4px;}
.progress-info .value{font-size:14.5px; font-weight:600;}
.progress-bar-track{
  height:6px; border-radius:4px; background:var(--border); overflow:hidden; margin-top:6px;
}
.progress-bar-fill{
  height:100%; background:linear-gradient(90deg, var(--jade), var(--gold));
  border-radius:4px; transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   CARD (question)
   ============================================================ */
.card-stage{position:relative; min-height:420px;}
.q-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px 26px 24px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  animation:cardIn .4s cubic-bezier(.3,0,.2,1);
}
@keyframes cardIn{from{opacity:0; transform:translateX(14px) scale(.985);} to{opacity:1; transform:translateX(0) scale(1);}}
.q-card::after{
  content:"";
  position:absolute; inset:0;
  border-radius:var(--radius);
  padding:1px;
  background:linear-gradient(135deg, var(--gold) 0%, transparent 18%, transparent 82%, var(--gold) 100%);
  opacity:.35;
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}
.q-meta{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.q-counter{
  font-size:12.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
.q-tools{display:flex; gap:8px;}
.tool-btn{
  width:34px;height:34px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-soft);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s ease;
}
.tool-btn svg{width:16px;height:16px;}
.tool-btn:hover{color:var(--text); border-color:var(--accent);}
.tool-btn.on{color:var(--gold); border-color:var(--gold); background:rgba(203,161,53,.12);}
.tool-btn.learned-on{color:var(--success); border-color:var(--success); background:rgba(59,122,87,.14);}
.tool-btn.translate-on{color:var(--jade-soft); border-color:var(--jade-soft); background:rgba(59,122,87,.12);}
.tool-btn-dich{
  width:748px; height:48px; border-radius:999px;
  border:1px solid var(--accent); background:var(--surface-2);
  color:var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s ease;
  position:fixed; right:22px; bottom:22px; z-index:1200;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}
/* SIZE FLAG: chỉnh width/height/right/bottom ở đây */
.tool-btn-dich svg{width:20px;height:20px;}
.tool-btn-dich:hover{color:var(--accent); border-color:var(--accent); transform:translateY(-2px);}

/* ============================================================
   TRANSLATE BOX — Vietnamese meaning helper
   ============================================================ */
.translate-box{
  display:none;
  margin-top:16px;
  padding:16px 16px 14px;
  border-radius:var(--radius-sm);
  background:var(--surface-2);
  border:1px dashed var(--jade-soft);
}
.translate-box.open{display:block; animation:fadeIn .3s ease;}
.translate-label{
  display:flex; align-items:center; gap:7px;
  font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
  color:var(--jade-soft); font-weight:600; margin-bottom:10px;
}
.translate-label svg{width:14px;height:14px;}
.translate-q{
  font-family:var(--font-display);
  font-size:16.5px; line-height:1.5; font-weight:500;
  margin:0 0 10px; color:var(--text);
}
.translate-opts{display:flex; flex-direction:column; gap:6px;}
.translate-opt{display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text-soft);}
.translate-opt .letter{
  flex:none; width:20px;height:20px; border-radius:6px;
  background:rgba(59,122,87,.15); color:var(--jade-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px; font-weight:700;
}
.translate-loading, .translate-error{
  font-size:13.5px; color:var(--text-soft); display:flex; align-items:center; gap:8px;
}
.translate-loading svg{width:14px;height:14px; animation:spin 1s linear infinite;}
.translate-error{color:var(--lacquer-red-soft);}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.q-text{
  font-family:var(--font-display);
  font-size:20px;
  line-height:1.5;
  font-weight:500;
  margin:0 0 22px;
}

.options{display:flex; flex-direction:column; gap:10px;}
.option{
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface-2);
  transition:all .25s ease;
  cursor:default;
  font-size:14.5px;
  line-height:1.5;
}
.option .letter{
  flex:none;
  width:26px;height:26px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px; font-weight:700;
  color:var(--text-soft);
  font-family:var(--font-body);
}
.option.correct-reveal{
  border-color:var(--success);
  background:rgba(59,122,87,.14);
}
.option.correct-reveal .letter{
  background:var(--success); border-color:var(--success); color:#fff;
}
.option.quiz-selected{border-color:var(--accent); background:rgba(203,161,53,.1);}
.option.quiz-selected .letter{background:var(--accent); border-color:var(--accent); color:var(--lacquer-black);}
.option.quiz-wrong{border-color:var(--danger); background:rgba(166,40,60,.12);}
.option.quiz-wrong .letter{background:var(--danger); border-color:var(--danger); color:#fff;}
.option.quiz-clickable{cursor:pointer;}
.option.quiz-clickable:hover{border-color:var(--accent);}
.option.dim{opacity:.55;}

.reveal-wrap{margin-top:6px;}
.reveal-btn{
  width:100%;
  padding:13px;
  border-radius:var(--radius-sm);
  border:1px dashed var(--border);
  background:transparent;
  color:var(--text-soft);
  font-size:14px; font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all .25s ease;
}
.reveal-btn:hover{border-color:var(--gold); color:var(--gold);}
.reveal-btn svg{width:17px;height:17px;}

.answer-banner{
  margin-top:14px;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  background:rgba(59,122,87,.14);
  border:1px solid var(--success);
  color:var(--success);
  font-size:14px; font-weight:600;
  display:flex; align-items:center; gap:8px;
  animation:fadeIn .3s ease;
}
.answer-banner svg{width:17px;height:17px; flex:none;}

/* ============================================================
   NAV CONTROLS (prev/next/random/first/last)
   ============================================================ */
.nav-row{
  display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;
}
.nav-btn{
  flex:1 1 auto;
  padding:11px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:13.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:6px;
  cursor:pointer;
  transition:all .2s ease;
}
.nav-btn svg{width:15px;height:15px;}
.nav-btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
.nav-btn.primary{background:var(--accent); border-color:var(--accent); color:var(--lacquer-black);}
html[data-theme="light"] .nav-btn.primary{color:#fffdf8;}
.nav-btn.primary:hover{color:var(--lacquer-black); opacity:.9;}
.nav-btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

.bulk-row{display:flex; gap:8px; margin-top:10px;}
.bulk-row .nav-btn{font-weight:500; font-size:13px;}

/* Empty state */
.empty-state{
  text-align:center; padding:60px 20px;
  color:var(--text-soft);
}
.empty-state svg{width:52px;height:52px; margin-bottom:14px; opacity:.5;}
.empty-state p{margin:4px 0; font-size:14.5px;}

/* ============================================================
   FLASHCARD
   ============================================================ */
.flash-stage{perspective:1600px; min-height:340px;}
.flash-card{
  position:relative;
  width:100%; min-height:340px;
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,.2,.2,1);
  cursor:pointer;
}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute; inset:0;
  backface-visibility:hidden;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface);
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:36px 30px;
}
.flash-face .eyebrow{
  font-size:11.5px; letter-spacing:2px; text-transform:uppercase;
  color:var(--accent); font-weight:700; margin-bottom:16px;
}
.flash-face .content{
  font-family:var(--font-display);
  font-size:21px; line-height:1.55; font-weight:500;
}
.flash-back{transform:rotateY(180deg);}
.flash-back .content{color:var(--success); font-size:19px;}
.flash-hint{
  position:absolute; bottom:16px; left:0; right:0;
  text-align:center; font-size:12px; color:var(--text-soft);
}

/* ============================================================
   QUIZ MODE
   ============================================================ */
.quiz-progress{
  display:flex; justify-content:space-between; font-size:13px; color:var(--text-soft); margin-bottom:10px;
}
.quiz-score-badge{
  font-weight:700; color:var(--accent);
}
.quiz-result{
  text-align:center; padding:50px 24px;
}
.quiz-result .score-big{
  font-family:var(--font-display); font-size:52px; font-weight:600; color:var(--accent);
  margin-bottom:6px;
}
.quiz-result p{color:var(--text-soft); font-size:15px;}

/* ============================================================
   STATS
   ============================================================ */
.stats-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px; margin-bottom:22px;
}
.stat-card{
  padding:20px 18px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--border);
  text-align:left;
}
.stat-card .num{font-family:var(--font-display); font-size:32px; font-weight:600;}
.stat-card .lbl{font-size:12.5px; color:var(--text-soft); margin-top:4px; letter-spacing:.3px;}
.stat-card.accent .num{color:var(--gold);}
.stat-card.success .num{color:var(--success);}
.stat-card.danger .num{color:var(--lacquer-red-soft);}

.completion-block{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px 22px 24px; margin-bottom:18px;
}
.completion-block h3{margin:0 0 14px; font-size:16px; font-weight:600;}
.big-bar-track{height:12px; border-radius:8px; background:var(--border); overflow:hidden;}
.big-bar-fill{height:100%; background:linear-gradient(90deg, var(--jade), var(--gold)); border-radius:8px; transition:width .6s ease;}
.completion-pct{font-family:var(--font-display); font-size:15px; margin-top:10px; color:var(--text-soft);}

/* ============================================================
   UPLOAD PANEL
   ============================================================ */
.upload-panel{
  background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:20px; display:none;
}
.upload-panel.open{display:block; animation:fadeIn .3s ease;}
.upload-panel h3{margin:0 0 8px; font-size:15px;}
.upload-panel p{margin:0 0 12px; font-size:13px; color:var(--text-soft); line-height:1.6;}
.upload-panel input[type=file]{font-size:13px; color:var(--text-soft);}
.upload-status{margin-top:10px; font-size:13px; font-weight:600;}

/* keyboard hint footer */
.kbd-hint{
  text-align:center; font-size:12px; color:var(--text-soft); margin-top:26px;
  display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
}
.kbd-hint kbd{
  background:var(--surface-2); border:1px solid var(--border); border-radius:5px;
  padding:2px 6px; font-family:var(--font-body); font-size:11px;
}

/* toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface); border:1px solid var(--gold); color:var(--text);
  padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:all .3s ease;
  z-index:50; display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:560px){
  .q-text{font-size:18px;}
  .nav-row{gap:6px;}
  .nav-btn{font-size:12px; padding:10px 6px;}
  .brand h1{font-size:18px;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="brand">
      <div class="drum-mark" id="drumLogo"></div>
      <div>
        <h1>Văn Hóa Việt</h1>
        <span class="sub">Ôn tập trắc nghiệm</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="uploadToggleBtn" title="Nạp file câu hỏi khác">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="icon-btn" id="themeToggleBtn" title="Chuyển giao diện sáng / tối"></button>
    </div>
  </div>

  <div class="upload-panel" id="uploadPanel">
    <h3>Nạp bộ câu hỏi khác (.txt)</h3>
    <p>Tải lên một file .txt khác theo định dạng: câu hỏi, các dòng đáp án A/B/C/D, rồi dòng đáp án đúng (ví dụ chỉ chứa "A"). Ứng dụng sẽ tự phân tích và thay thế bộ câu hỏi hiện tại.</p>
    <input type="file" id="fileInput" accept=".txt">
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <div class="tabs" id="tabs">

/* ============================================================
   DATA + PARSER
   ============================================================ */
function normalizeRaw(rawArr){
  return rawArr.map(r => ({ q:r[0], A:r[1], B:r[2], C:r[3], D:r[4], ans:r[5] }));
}

// Mirrors the offline parser used to build the bundled dataset, so a
// re-uploaded .txt with the same loose formatting parses the same way.
function parseTxtToQuestions(text){
  text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n');
  const anchors = [];
  const anchorRe = /^[A-D]\.?$/;
  lines.forEach((l, i) => { if (anchorRe.test(l.trim())) anchors.push(i); });

  function findLast(letter, block){
    const re = new RegExp('^' + letter + '(?:[.):]\\s*|\\s+)');
    for (let j = block.length - 1; j >= 0; j--){
      if (re.test(block[j].trim())) return j;
    }
    return null;
  }
  function extract(letter, pos, block){
    if (pos === null) return '';
    const re = new RegExp('^' + letter + '(?:[.):]\\s*|\\s+)');
    return block[pos].trim().replace(re, '');
  }

  const out = [];
  let prevEnd = 0;
  for (const a of anchors){
    const block = lines.slice(prevEnd, a);
    const answer = lines[a].trim().replace(/\.$/, '');
    const apos = findLast('A', block);
    const bpos = findLast('B', block);
    const cpos = findLast('C', block);
    const dpos = findLast('D', block);
    const positions = [apos, bpos, cpos, dpos].filter(p => p !== null);
    if (positions.length === 0){ prevEnd = a + 1; continue; }
    const cutoff = Math.min(...positions);
    const A = extract('A', apos, block);
    const B = extract('B', bpos, block);
    const C = extract('C', cpos, block);
    const D = extract('D', dpos, block);
    let stemLines = block.slice(0, cutoff)
      .map(x => x.trim())
      .filter(x => x && !/check one option\.?/i.test(x));
    let stem = stemLines.join(' ');
    stem = stem.replace(/\(Kiểu hỏi khác[\s\S]*?\)/gi, '').trim();
    if (!stem) stem = '(Câu hỏi không có tiêu đề)';
    if (A || B || C || D){
      out.push({ q: stem, A, B, C, D, ans: answer || 'A' });
    }
    prevEnd = a + 1;
  }
  return out;
}

let QUESTIONS = normalizeRaw(QUESTIONS_RAW);

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const STORAGE_KEY = 'vnc_quiz_state_v2';

function defaultState(){
  return {
    theme: 'dark',
    viewed: {}, learned: {}, bookmarked: {}, wrongCount: {},
    translations: {},
    study: { filter: 'all', search: '', pos: 0, autoReveal: false, revealedNow: false },
    flash: { filter: 'all', search: '', pos: 0, flipped: false },
    bookmarks: { pos: 0, revealedNow: false },
  };
}

let state = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      study: Object.assign(defaultState().study, parsed.study || {}),
      flash: Object.assign(defaultState().flash, parsed.flash || {}),
      bookmarks: Object.assign(defaultState().bookmarks, parsed.bookmarks || {}),
    });
  } catch (e) { return defaultState(); }
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ============================================================
   TRANSLATE — Vietnamese meaning helper for the current question
   ============================================================ */
async function translateText(text){
  if (!text || !text.trim()) return '';
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Translate request failed');
  const data = await res.json();
  return (data[0] || []).map(chunk => chunk[0]).join('');
}

function translationContentHtml(t){
  const letters = ['A','B','C','D'];
  const optsHtml = letters.map(L => t[L]
    ? `<div class="translate-opt"><span class="letter">${L}</span><span>${escapeHtml(t[L])}</span></div>`
    : '').join('');
  return `<div class="translate-label">${ICONS.translate} Dịch nghĩa tiếng Việt</div>
    <p class="translate-q">${escapeHtml(t.q)}</p>
    <div class="translate-opts">${optsHtml}</div>`;
}

async function toggleTranslate(idx, boxId, btnId){
  const box = document.getElementById(boxId);
  const btn = document.getElementById(btnId);
  if (!box) return;
  const willOpen = !box.classList.contains('open');
  box.classList.toggle('open', willOpen);
  if (btn) btn.classList.toggle('translate-on', willOpen);
  if (!willOpen) return;

  if (state.translations[idx]){
    box.innerHTML = translationContentHtml(state.translations[idx]);
    return;
  }
  box.innerHTML = `<div class="translate-loading">${ICONS.translate} Đang dịch câu hiện tại...</div>`;
  try {
    const q = QUESTIONS[idx];
    const parts = [q.q, q.A, q.B, q.C, q.D];
    const translated = await Promise.all(parts.map(p => (p ? translateText(p) : Promise.resolve(''))));
    const result = { q: translated[0], A: translated[1], B: translated[2], C: translated[3], D: translated[4] };
    // guard against stale response if the user navigated away meanwhile
    if (!document.body.contains(box)) return;
    state.translations[idx] = result;
    saveState();
    box.innerHTML = translationContentHtml(result);
  } catch (e){
    box.innerHTML = `<div class="translate-error">Không thể dịch lúc này. Vui lòng kiểm tra kết nối mạng và thử lại.</div>`;
  }
}

/* ============================================================
   FILTER HELPERS
   ============================================================ */
function getFilteredIndices(filter, search){
  const s = (search || '').trim().toLowerCase();
  const out = [];
  for (let i = 0; i < QUESTIONS.length; i++){
    const q = QUESTIONS[i];
    if (s){
      const hay = (q.q + ' ' + q.A + ' ' + q.B + ' ' + q.C + ' ' + q.D).toLowerCase();
      if (!hay.includes(s)) continue;
    }
    if (filter === 'learned' && !state.learned[i]) continue;
    if (filter === 'unlearned' && state.learned[i]) continue;
    if (filter === 'bookmarked' && !state.bookmarked[i]) continue;
    if (filter === 'wrong' && !(state.wrongCount[i] >= 2)) continue;
    out.push(i);
  }
  return out;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlightMatch(str, search){
  const safe = escapeHtml(str);
  if (!search) return safe;
  try {
    const re = new RegExp('(' + escapeRegex(search) + ')', 'ig');
    return safe.replace(re, '<mark style="background:var(--gold);color:var(--lacquer-black);border-radius:3px;padding:0 1px;">$1</mark>');
  } catch (e) { return safe; }
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

const TAB_IDS = ['study', 'flash', 'quiz', 'bookmarks', 'stats'];

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  TAB_IDS.forEach(id => document.getElementById('view-' + id).classList.toggle('active', id === tab));
  document.getElementById('kbdHint').style.display = (tab === 'quiz' || tab === 'stats') ? 'none' : 'flex';
  renderCurrentTab();
}
function renderCurrentTab(){
  if (currentTab === 'study') renderStudy();
  else if (currentTab === 'flash') renderFlash();
  else if (currentTab === 'quiz') renderQuiz();
  else if (currentTab === 'bookmarks') renderBookmarks();
  else if (currentTab === 'stats') renderStats();
}

/* ============================================================
   PROGRESS RING (signature Đông Sơn drum motif reused as progress)
   ============================================================ */
function ringSvg(pct, size){
  size = size || 44;
  const r = size / 2 - 4;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s ease"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r*0.42}" fill="none" stroke="var(--jade)" stroke-width="2" opacity=".55"/>
  </svg>`;
}

/* ============================================================
   STUDY VIEW
   ============================================================ */
function clampPos(pos, len){
  if (len === 0) return 0;
  return Math.max(0, Math.min(pos, len - 1));
}

function renderStudy(){
  const el = document.getElementById('view-study');
  const st = state.study;
  const list = getFilteredIndices(st.filter, st.search);
  st.pos = clampPos(st.pos, list.length);
  const viewedCount = Object.keys(state.viewed).length;
  const totalPct = QUESTIONS.length ? viewedCount / QUESTIONS.length : 0;

  let html = '';
  html += controlRowHtml('study', st.filter, st.search);
  html += `<div class="progress-wrap">
    <div class="progress-ring">${ringSvg(totalPct)}</div>
    <div class="progress-info">
      <div class="label">Tiến độ tổng thể</div>
      <div class="value">${viewedCount} / ${QUESTIONS.length} câu đã xem</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${(totalPct*100).toFixed(1)}%"></div></div>
    </div>
  </div>`;

  if (list.length === 0){
    html += emptyStateHtml();
  } else {
    const idx = list[st.pos];
    html += `<div class="card-stage">${questionCardHtml(idx, st.pos, list.length, st.revealedNow, st.search)}</div>`;
    html += navRowHtml('study');
    html += `<div class="bulk-row">
      <button class="nav-btn" id="studyRevealAllBtn">${ICONS.eye} ${st.autoReveal ? 'Ẩn tất cả đáp án' : 'Hiện tất cả đáp án'}</button>
    </div>`;
  }
  el.innerHTML = html;
  bindCommonCardEvents('study', list);
  bindControlEvents('study');
  bindNavEvents('study', list);
  if (list.length){
    const revealBtn = document.getElementById('studyRevealAllBtn');
    if (revealBtn) revealBtn.onclick = () => {
      st.autoReveal = !st.autoReveal;
      st.revealedNow = st.autoReveal;
      saveState(); renderStudy();
    };
    markViewed(list[st.pos]);
  }
}

function controlRowHtml(prefix, filter, search){
  return `<div class="control-row">
    <div class="search-box">
      ${ICONS.search}
      <input type="text" id="${prefix}SearchInput" placeholder="Tìm theo từ khóa hoặc nội dung câu hỏi..." value="${escapeHtml(search || '')}">
    </div>
    <select class="filter-select" id="${prefix}FilterSelect">
      <option value="all" ${filter==='all'?'selected':''}>Tất cả</option>
      <option value="learned" ${filter==='learned'?'selected':''}>Đã học</option>
      <option value="unlearned" ${filter==='unlearned'?'selected':''}>Chưa học</option>
      <option value="bookmarked" ${filter==='bookmarked'?'selected':''}>Đã đánh dấu</option>
      <option value="wrong" ${filter==='wrong'?'selected':''}>Sai nhiều</option>
    </select>
  </div>`;
}
function bindControlEvents(prefix){
  const st = state[prefix === 'bookmarks' ? 'bookmarks' : prefix];
  const searchInput = document.getElementById(prefix + 'SearchInput');
  const filterSelect = document.getElementById(prefix + 'FilterSelect');
  if (searchInput){
    searchInput.oninput = (e) => {
      state[prefix].search = e.target.value;
      state[prefix].pos = 0;
      saveState();
      renderCurrentTab();
      // restore focus + caret after re-render
      requestAnimationFrame(() => {
        const inp = document.getElementById(prefix + 'SearchInput');
        if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    };
  }
  if (filterSelect){
    filterSelect.onchange = (e) => {
      state[prefix].filter = e.target.value;
      state[prefix].pos = 0;
      saveState();
      renderCurrentTab();
    };
  }
}

function emptyStateHtml(){
  return `<div class="empty-state">
    ${ICONS.inbox}
    <p><strong>Không tìm thấy câu hỏi nào</strong></p>
    <p>Hãy thử từ khóa khác hoặc đổi bộ lọc.</p>
  </div>`;
}

function questionCardHtml(idx, pos, total, revealed, search, boxPrefix){
  boxPrefix = boxPrefix || 'study';
  const q = QUESTIONS[idx];
  const isBookmarked = !!state.bookmarked[idx];
  const isLearned = !!state.learned[idx];
  const letters = ['A','B','C','D'];
  const opts = [q.A, q.B, q.C, q.D];
  let optsHtml = '';
  letters.forEach((L, i) => {
    if (!opts[i]) return;
    const isCorrect = L === q.ans;
    const cls = revealed && isCorrect ? 'option correct-reveal' : 'option';
    optsHtml += `<div class="${cls}">
      <span class="letter">${L}</span>
      <span>${highlightMatch(opts[i], search)}</span>
    </div>`;
  });
  const boxId = boxPrefix + 'TranslateBox';
  const btnId = boxPrefix + 'TranslateBtn';
  return `<div class="q-card" data-idx="${idx}">
    <div class="q-meta">
      <span class="q-counter">Câu ${pos + 1} / ${total}</span>
      <div class="q-tools">
        <button class="tool-btn-dich" id="${btnId}" title="Dịch nghĩa tiếng Việt">${ICONS.translate}</button>
        <button class="tool-btn ${isLearned ? 'learned-on' : ''}" id="learnedBtn" title="Đánh dấu đã học">${ICONS.check}</button>
        <button class="tool-btn ${isBookmarked ? 'on' : ''}" id="bookmarkBtn" title="Đánh dấu (Bookmark)">${isBookmarked ? ICONS.star : ICONS.starOutline}</button>
      </div>
    </div>
    <p class="q-text">${highlightMatch(q.q, search)}</p>
    <div class="options">${optsHtml}</div>
    <div class="reveal-wrap">
      ${revealed
        ? `<div class="answer-banner">${ICONS.checkCircle} Đáp án đúng: ${q.ans}. ${escapeHtml(opts[letters.indexOf(q.ans)] || '')}</div>`
        : `<button class="reveal-btn" id="revealBtn">${ICONS.eye} Hiện đáp án</button>`}
    </div>
    <div class="translate-box" id="${boxId}"></div>
  </div>`;
}

function bindCommonCardEvents(prefix, list){
  const stKey = prefix === 'bookmarks' ? 'bookmarks' : prefix;
  const st = state[stKey];
  if (!list.length) return;
  const idx = list[st.pos];
  const learnedBtn = document.getElementById('learnedBtn');
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  const revealBtn = document.getElementById('revealBtn');
  const translateBtn = document.getElementById(prefix + 'TranslateBtn');
  if (translateBtn) translateBtn.onclick = () => toggleTranslate(idx, prefix + 'TranslateBox', prefix + 'TranslateBtn');
  if (learnedBtn) learnedBtn.onclick = () => {
    if (state.learned[idx]) delete state.learned[idx]; else state.learned[idx] = true;
    saveState(); renderCurrentTab();
    toast(state.learned[idx] ? 'Đã đánh dấu: Đã học' : 'Bỏ đánh dấu đã học');
  };
  if (bookmarkBtn) bookmarkBtn.onclick = () => {
    toggleBookmark(idx);
  };
  if (revealBtn) revealBtn.onclick = () => {
    st.revealedNow = true;
    saveState(); renderCurrentTab();
  };
}
function toggleBookmark(idx){
  if (state.bookmarked[idx]) delete state.bookmarked[idx]; else state.bookmarked[idx] = true;
  saveState(); renderCurrentTab();
  toast(state.bookmarked[idx] ? '⭐ Đã thêm vào Bookmarks' : 'Đã bỏ khỏi Bookmarks');
}
function markViewed(idx){
  if (idx === undefined || idx === null) return;
  if (!state.viewed[idx]){ state.viewed[idx] = true; saveState(); }
}

function navRowHtml(prefix){
  return `<div class="nav-row">
    <button class="nav-btn" id="${prefix}FirstBtn" title="Câu đầu">${ICONS.first} Đầu</button>
    <button class="nav-btn" id="${prefix}PrevBtn" title="Câu trước">${ICONS.chevLeft} Trước</button>
    <button class="nav-btn primary" id="${prefix}RandomBtn" title="Ngẫu nhiên">${ICONS.shuffle} Ngẫu nhiên</button>
    <button class="nav-btn" id="${prefix}NextBtn" title="Câu tiếp">Tiếp ${ICONS.chevRight}</button>
    <button class="nav-btn" id="${prefix}LastBtn" title="Câu cuối">Cuối ${ICONS.last}</button>
  </div>`;
}
function bindNavEvents(prefix, list){
  const stKey = prefix === 'bookmarks' ? 'bookmarks' : prefix;
  const st = state[stKey];
  const setPos = (p) => {
    st.pos = clampPos(p, list.length);
    st.revealedNow = (stKey === 'study') ? state.study.autoReveal : (stKey === 'flash' ? false : false);
    if (stKey === 'flash') state.flash.flipped = false;
    saveState(); renderCurrentTab();
  };
  const firstBtn = document.getElementById(prefix + 'FirstBtn');
  const prevBtn = document.getElementById(prefix + 'PrevBtn');
  const randomBtn = document.getElementById(prefix + 'RandomBtn');
  const nextBtn = document.getElementById(prefix + 'NextBtn');
  const lastBtn = document.getElementById(prefix + 'LastBtn');
  if (firstBtn) firstBtn.onclick = () => setPos(0);
  if (prevBtn) prevBtn.onclick = () => setPos(st.pos - 1);
  if (nextBtn) nextBtn.onclick = () => setPos(st.pos + 1);
  if (lastBtn) lastBtn.onclick = () => setPos(list.length - 1);
  if (randomBtn) randomBtn.onclick = () => {
    if (list.length <= 1) return setPos(0);
    let p;
    do { p = Math.floor(Math.random() * list.length); } while (p === st.pos);
    setPos(p);
  };
}

/* ============================================================
   BOOKMARKS VIEW (reuses study-like card, forced filter)
   ============================================================ */
function renderBookmarks(){
  const el = document.getElementById('view-bookmarks');
  const st = state.bookmarks;
  const list = getFilteredIndices('bookmarked', '');
  st.pos = clampPos(st.pos, list.length);
  let html = '';
  if (list.length === 0){
    html += `<div class="empty-state">${ICONS.star}<p><strong>Chưa có câu nào được đánh dấu</strong></p><p>Bấm biểu tượng ⭐ trên mỗi câu hỏi để lưu vào đây.</p></div>`;
  } else {
    const idx = list[st.pos];
    html += `<div class="card-stage">${questionCardHtml(idx, st.pos, list.length, st.revealedNow, '', 'bookmarks')}</div>`;
    html += navRowHtml('bookmarks');
  }
  el.innerHTML = html;
  bindCommonCardEvents('bookmarks', list);
  bindNavEvents('bookmarks', list);
  if (list.length){
    const revealBtn = document.getElementById('revealBtn');
    if (revealBtn) revealBtn.onclick = () => { st.revealedNow = true; saveState(); renderBookmarks(); };
    markViewed(list[st.pos]);
  }
}

/* ============================================================
   FLASHCARD VIEW
   ============================================================ */
function renderFlash(){
  const el = document.getElementById('view-flash');
  const st = state.flash;
  const list = getFilteredIndices(st.filter, st.search);
  st.pos = clampPos(st.pos, list.length);
  let html = '';
  html += controlRowHtml('flash', st.filter, st.search);

  if (list.length === 0){
    html += emptyStateHtml();
  } else {
    const idx = list[st.pos];
    const q = QUESTIONS[idx];
    const letters = ['A','B','C','D'];
    const opts = [q.A,q.B,q.C,q.D];
    const ansText = opts[letters.indexOf(q.ans)] || '';
    const isBookmarked = !!state.bookmarked[idx];
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span class="q-counter">Câu ${st.pos+1} / ${list.length}</span>
      <div class="q-tools">
        <button class="tool-btn" id="flashTranslateBtn" title="Dịch nghĩa tiếng Việt">${ICONS.translate}</button>
        <button class="tool-btn ${isBookmarked?'on':''}" id="flashBookmarkBtn">${isBookmarked?ICONS.star:ICONS.starOutline}</button>
      </div>
    </div>`;
    html += `<div class="flash-stage">
      <div class="flash-card ${st.flipped ? 'flipped' : ''}" id="flashCard">
        <div class="flash-face flash-front">
          <span class="eyebrow">Câu hỏi</span>
          <div class="content">${escapeHtml(q.q)}</div>
        </div>
        <div class="flash-face flash-back">
          <span class="eyebrow" style="color:var(--success);">Đáp án đúng — ${q.ans}</span>
          <div class="content">${escapeHtml(ansText)}</div>
        </div>
      </div>
      <div class="flash-hint">Bấm vào thẻ hoặc phím Space để lật</div>
    </div>`;
    html += `<div class="translate-box" id="flashTranslateBox"></div>`;
    html += navRowHtml('flash');
  }
  el.innerHTML = html;
  bindControlEvents('flash');
  bindNavEvents('flash', list);
  if (list.length){
    const idx = list[st.pos];
    document.getElementById('flashCard').onclick = () => {
      st.flipped = !st.flipped; saveState(); renderFlash();
    };
    const bm = document.getElementById('flashBookmarkBtn');
    if (bm) bm.onclick = (e) => { e.stopPropagation(); toggleBookmark(idx); };
    const tr = document.getElementById('flashTranslateBtn');
    if (tr) tr.onclick = (e) => { e.stopPropagation(); toggleTranslate(idx, 'flashTranslateBox', 'flashTranslateBtn'); };
    markViewed(idx);
  }
}

/* ============================================================
   QUIZ MODE
   ============================================================ */
let quizState = null;
function newQuizSession(){
  const order = QUESTIONS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  quizState = { order, pos: 0, score: 0, selected: null, answered: false, finished: false };
}
function renderQuiz(){
  const el = document.getElementById('view-quiz');
  if (!quizState) newQuizSession();
  if (quizState.finished){
    const pct = quizState.order.length ? Math.round(quizState.score / quizState.order.length * 100) : 0;
    el.innerHTML = `<div class="q-card quiz-result">
      <div class="score-big">${quizState.score} / ${quizState.order.length}</div>
      <p>Bạn đã trả lời đúng ${pct}% số câu trong phiên luyện tập này.</p>
      <div class="nav-row" style="margin-top:22px;">
        <button class="nav-btn primary" id="quizRestartBtn">${ICONS.shuffle} Làm lại từ đầu</button>
      </div>
    </div>`;
    document.getElementById('quizRestartBtn').onclick = () => { newQuizSession(); renderQuiz(); };
    return;
  }
  const idx = quizState.order[quizState.pos];
  const q = QUESTIONS[idx];
  const letters = ['A','B','C','D'];
  const opts = [q.A,q.B,q.C,q.D];
  let optsHtml = '';
  letters.forEach((L, i) => {
    if (!opts[i]) return;
    let cls = 'option quiz-clickable';
    if (quizState.answered){
      if (L === q.ans) cls = 'option correct-reveal';
      else if (L === quizState.selected) cls = 'option quiz-wrong';
      else cls = 'option dim';
    }
    optsHtml += `<div class="${cls}" data-letter="${L}">
      <span class="letter">${L}</span><span>${escapeHtml(opts[i])}</span>
    </div>`;
  });
  let feedback = '';
  if (quizState.answered){
    const correct = quizState.selected === q.ans;
    feedback = `<div class="answer-banner" style="${correct ? '' : 'background:rgba(166,40,60,.14);border-color:var(--danger);color:var(--lacquer-red-soft);'}">
      ${correct ? ICONS.checkCircle : ICONS.eyeOff} ${correct ? 'Chính xác!' : 'Chưa đúng.'} Đáp án đúng là ${q.ans}. ${escapeHtml(opts[letters.indexOf(q.ans)] || '')}
    </div>`;
  }
  el.innerHTML = `
    <div class="quiz-progress">
      <span>Câu ${quizState.pos + 1} / ${quizState.order.length}</span>
      <span class="quiz-score-badge">Điểm: ${quizState.score}</span>
    </div>
    <div class="progress-bar-track" style="margin-bottom:16px;"><div class="progress-bar-fill" style="width:${(quizState.pos/quizState.order.length*100)}%"></div></div>
    <div class="q-card">
      <div class="q-meta">
        <span></span>
        <div class="q-tools">
          <button class="tool-btn" id="quizTranslateBtn" title="Dịch nghĩa tiếng Việt">${ICONS.translate}</button>
        </div>
      </div>
      <p class="q-text">${escapeHtml(q.q)}</p>
      <div class="options">${optsHtml}</div>
      ${feedback}
      <div class="translate-box" id="quizTranslateBox"></div>
    </div>
    <div class="nav-row">
      <button class="nav-btn primary" id="quizNextBtn" ${quizState.answered ? '' : 'disabled'}>
        ${quizState.pos === quizState.order.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo'} ${ICONS.chevRight}
      </button>
    </div>`;
  const quizTranslateBtn = document.getElementById('quizTranslateBtn');
  if (quizTranslateBtn) quizTranslateBtn.onclick = () => toggleTranslate(idx, 'quizTranslateBox', 'quizTranslateBtn');
  el.querySelectorAll('.option[data-letter]').forEach(optEl => {
    optEl.onclick = () => {
      if (quizState.answered) return;
      const L = optEl.dataset.letter;
      quizState.selected = L;
      quizState.answered = true;
      if (L === q.ans) quizState.score++;
      else state.wrongCount[idx] = (state.wrongCount[idx] || 0) + 1;
      state.viewed[idx] = true;
      saveState();
      renderQuiz();
    };
  });
  const nextBtn = document.getElementById('quizNextBtn');
  if (nextBtn) nextBtn.onclick = () => {
    if (quizState.pos === quizState.order.length - 1){
      quizState.finished = true;
    } else {
      quizState.pos++;
      quizState.selected = null;
      quizState.answered = false;
    }
    renderQuiz();
  };
}

/* ============================================================
   STATS VIEW
   ============================================================ */
function renderStats(){
  const el = document.getElementById('view-stats');
  const total = QUESTIONS.length;
  const viewedCount = Object.keys(state.viewed).length;
  const learnedCount = Object.keys(state.learned).length;
  const bookmarkedCount = Object.keys(state.bookmarked).length;
  const wrongCount = Object.values(state.wrongCount).filter(v => v >= 2).length;
  const pct = total ? (viewedCount / total * 100) : 0;

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">Tổng số câu</div></div>
      <div class="stat-card success"><div class="num">${learnedCount}</div><div class="lbl">Đã học</div></div>
      <div class="stat-card accent"><div class="num">${bookmarkedCount}</div><div class="lbl">Bookmark</div></div>
      <div class="stat-card"><div class="num">${viewedCount}</div><div class="lbl">Đã xem</div></div>
      <div class="stat-card danger"><div class="num">${wrongCount}</div><div class="lbl">Sai nhiều lần</div></div>
    </div>
    <div class="completion-block">
      <h3>Tỷ lệ hoàn thành</h3>
      <div class="big-bar-track"><div class="big-bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="completion-pct">${pct.toFixed(1)}% (${viewedCount}/${total} câu đã xem)</div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="resetStatsBtn" style="border-color:var(--lacquer-red-soft);color:var(--lacquer-red-soft);">Xóa toàn bộ tiến độ đã lưu</button>
    </div>`;
  document.getElementById('resetStatsBtn').onclick = () => {
    if (confirm('Xóa toàn bộ tiến độ (đã học, bookmark, đã xem, thống kê sai)? Hành động này không thể hoàn tác.')){
      const theme = state.theme;
      const translations = state.translations;
      state = defaultState();
      state.theme = theme;
      state.translations = translations;
      saveState();
      quizState = null;
      toast('Đã xóa toàn bộ tiến độ');
      renderCurrentTab();
    }
  };
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : 'dark');
  const btn = document.getElementById('themeToggleBtn');
  btn.innerHTML = state.theme === 'light' ? ICONS.moon : ICONS.sun;
}
document.getElementById('themeToggleBtn').addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  saveState(); applyTheme();
});

/* ============================================================
   UPLOAD PANEL
   ============================================================ */
document.getElementById('uploadToggleBtn').addEventListener('click', () => {
  document.getElementById('uploadPanel').classList.toggle('open');
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('uploadStatus');
  statusEl.style.color = 'var(--text-soft)';
  statusEl.textContent = 'Đang đọc và phân tích file...';
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = parseTxtToQuestions(ev.target.result);
      if (!parsed.length){
        statusEl.style.color = 'var(--lacquer-red-soft)';
        statusEl.textContent = 'Không nhận diện được câu hỏi nào trong file này.';
        return;
      }
      QUESTIONS = parsed;
      state = defaultState();
      saveState();
      quizState = null;
      statusEl.style.color = 'var(--success)';
      statusEl.textContent = `✓ Đã nạp thành công ${parsed.length} câu hỏi.`;
      toast(`Đã tải bộ câu hỏi mới: ${parsed.length} câu`);
      switchTab('study');
    } catch (err){
      statusEl.style.color = 'var(--lacquer-red-soft)';
      statusEl.textContent = 'Có lỗi khi phân tích file: ' + err.message;
    }
  };
  reader.readAsText(file, 'UTF-8');
});

/* ============================================================
   TAB WIRING
   ============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (!['study', 'flash', 'bookmarks'].includes(currentTab)) return;

  const stKey = currentTab;
  const list = currentTab === 'study' ? getFilteredIndices(state.study.filter, state.study.search)
             : currentTab === 'flash' ? getFilteredIndices(state.flash.filter, state.flash.search)
             : getFilteredIndices('bookmarked', '');
  const st = state[stKey];
  if (!list.length) return;
  const idx = list[st.pos];

  if (e.key === 'ArrowLeft'){ e.preventDefault(); st.pos = clampPos(st.pos - 1, list.length); resetRevealOnNav(stKey); saveState(); renderCurrentTab(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); st.pos = clampPos(st.pos + 1, list.length); resetRevealOnNav(stKey); saveState(); renderCurrentTab(); }
  else if (e.code === 'Space'){
    e.preventDefault();
    if (currentTab === 'flash'){ state.flash.flipped = !state.flash.flipped; }
    else { st.revealedNow = true; }
    saveState(); renderCurrentTab();
  }
  else if (e.key === 'b' || e.key === 'B'){ e.preventDefault(); toggleBookmark(idx); }
  else if (e.key === 'r' || e.key === 'R'){
    e.preventDefault();
    if (list.length > 1){
      let p; do { p = Math.floor(Math.random() * list.length); } while (p === st.pos);
      st.pos = p; resetRevealOnNav(stKey); saveState(); renderCurrentTab();
    }
  }
});
function resetRevealOnNav(stKey){
  if (stKey === 'study') state.study.revealedNow = state.study.autoReveal;
  else if (stKey === 'bookmarks') state.bookmarks.revealedNow = false;
  else if (stKey === 'flash') state.flash.flipped = false;
}
